name: Build Windows Executable

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pygame pyinstaller
      - run: pyinstaller --onefile --windowed --name "SobrevivienteSinCV" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: SobrevivienteSinCV
          path: dist/SobrevivienteSinCV.exe
