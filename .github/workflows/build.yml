name: Build Windows Executable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pygame pyinstaller
      - run: pyinstaller --onefile --windowed --name "SobrevivienteSinCV" main.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add -f dist/SobrevivienteSinCV.exe
          git commit -m "Rebuild Windows exe [skip ci]" || echo "No changes to commit"
          git push
